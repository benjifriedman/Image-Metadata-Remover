<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Metadata Remover</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
        }
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 4px;
            padding: 20px;
            margin: 20px 0;
            cursor: pointer;
        }
        .drop-zone:hover {
            background-color: #f8f8f8;
        }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Image Metadata Remover</h1>
    <p>Create a still copy without embedded personal metadata. Processing stays in your browser.</p>
    
    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <p>Drop an image here or <button type="button">choose a file</button></p>
    </div>
    
    <p id="status" role="status"></p>
    <a id="download" hidden>Download cleaned image</a>
    <img id="preview" alt="Preview">

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');

        // Handle click to upload
        dropZone.addEventListener('click', (event) => {
            if (event.target !== fileInput) fileInput.click();
        });

        // Handle drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#000';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#ccc';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            handleFile(e.dataTransfer.files[0]);
        });

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        const status = document.getElementById('status');
        const download = document.getElementById('download');
        const extensions = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
        let latest = 0;
        let resultUrl;

        async function handleFile(file) {
            if (!file) return;
            const request = ++latest;
            fileInput.value = '';
            download.hidden = true;
            download.removeAttribute('href');
            preview.style.display = 'none';
            preview.removeAttribute('src');
            if (resultUrl) URL.revokeObjectURL(resultUrl);
            resultUrl = null;
            status.textContent = 'Preparing your image…';

            const sourceUrl = URL.createObjectURL(file);
            try {
                const image = new Image();
                image.src = sourceUrl;
                await image.decode();
                if (request !== latest) return;

                const canvas = document.createElement('canvas');
                canvas.width = image.naturalWidth;
                canvas.height = image.naturalHeight;
                canvas.getContext('2d').drawImage(image, 0, 0);
                const type = Object.hasOwn(extensions, file.type) ? file.type : 'image/png';
                const blob = await new Promise(resolve => canvas.toBlob(resolve, type));
                if (request !== latest) return;
                if (!blob || !extensions[blob.type]) throw new Error('Export failed');

                const extension = extensions[blob.type];
                const base = file.name.replace(/\.[^.]*$/, '') || 'image';
                resultUrl = URL.createObjectURL(blob);
                preview.src = resultUrl;
                preview.style.display = 'block';
                download.href = resultUrl;
                download.download = `clean_${base}.${extension}`;
                download.hidden = false;
                status.textContent = `Created a still ${extension.toUpperCase()} copy. Download: ${download.download}`;
                download.click();
            } catch {
                if (request === latest) {
                    status.textContent = 'Could not read or export this image. Try a JPEG or PNG copy.';
                }
            } finally {
                URL.revokeObjectURL(sourceUrl);
            }
        }
    </script>
</body>
</html>
